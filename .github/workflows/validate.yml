name: Validate static lab

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run check:evidence
      - run: npm run check:trace:online
      - run: npm run test:trace
      - run: npm run test:copilot
      - name: Read pinned Lens commit
        id: lens-pin
        run: echo "commit=$(node -p "require('./mcp/madrid-evidence/lens-pin.json').commit")" >> "$GITHUB_OUTPUT"
      - name: Check out pinned Lens
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: soroushkarahrodi79-oss/madrid-tourism-intelligence-lens
          ref: ${{ steps.lens-pin.outputs.commit }}
          path: lens-pinned
          persist-credentials: false
      - name: Madrid Evidence MCP integration test
        run: npm run test:madrid-mcp
        env:
          MADRID_LENS_ROOT: ${{ github.workspace }}/lens-pinned
      - name: Madrid Evidence MCP licences_in_lens test
        run: npm run test:madrid-licences
        env:
          MADRID_LENS_ROOT: ${{ github.workspace }}/lens-pinned
      - name: Madrid Evidence MCP evaluation seal (offline)
        run: node mcp/madrid-evidence/eval/eval.mjs verify
      - name: Madrid Evidence MCP transcript verifier (offline)
        run: npm run test:madrid-verifier
      - name: Madrid Evidence MCP v0.3 evaluation scorer (offline)
        run: npm run test:madrid-eval-v03
      - run: node --test tests/madrid-evidence-eval-v04cmp.test.mjs
      - run: npm run check:skeletons
      - run: npm run check:review-checklist
      - run: npm run check:review-record
      - run: npm run check:review-packet
      - run: npm run check:test-set
      - run: npm run check:sonnet-prerequisites
      - run: npm run evaluate:copilot
      - run: npm run evaluate:copilot:v2
      - run: npm run check:links
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
